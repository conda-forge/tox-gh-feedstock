{% set name = "tox-gh" %}
{% set version = "1.9.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/tox_gh-{{ version }}.tar.gz
  sha256: 3b1a473dc0ea45ed9ab4d180b3d7f9c748c3efec3e375a0575b2980429975d63

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatch-vcs >=0.5
    - hatchling >=1.32.4
    - hatch-fancy-pypi-readme >=25.1
    - pip
  run:
    - python >={{ python_min }}
    - tox >=4.64.7
    - typing-extensions >=4.16
  run_constrained:
    - covdefaults >=2.3
    - devpi-process >=1.2
    - diff-cover >=10.6
    - pytest >=9.1.1
    - pytest-cov >=7.1
    - pytest-mock >=3.16
    - tox-uv >=1.36.1

test:
  imports:
    - tox_gh
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/tox-dev/tox-gh
  summary: Seamless integration of tox into GitHub Actions.
  description: |
    tox-gh is a tox plugin which helps running tox on GitHub Actions with multiple
    different Python versions on multiple workers in parallel.
  dev_url: https://github.com/tox-dev/tox-gh
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Zeitsperre
